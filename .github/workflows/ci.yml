name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install nightly (fmt/clippy per Taskfile)
        run: |
          rustup toolchain install nightly
          rustup component add --toolchain nightly clippy rustfmt

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: cargo-${{ runner.os }}-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-lint-

      - name: task lint
        run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: cargo-${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-test-

      - name: task test
        run: task test
